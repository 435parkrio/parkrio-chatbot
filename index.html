<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="규약·규정 Chatbot 준비 중입니다"><title>파크리오 규약·규정 Chatbot</title><style>*{box-sizing:border-box}body{margin:0;color:#172d51;background:#edf7fe;font-family:'Malgun Gothic',sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:36px;background:radial-gradient(ellipse at 65% 35%,white,#e4f2fb)}.wrap{width:min(1200px,100%)}header{font-size:14px;letter-spacing:4px;color:#55758b;font-weight:700}.hero{display:grid;grid-template-columns:1.3fr 1fr;align-items:center;gap:30px;padding:60px 0}.label{font-size:12px;letter-spacing:5px;color:#6d8a9d}h1{font-size:clamp(32px,4.2vw,62px);line-height:1.45;letter-spacing:-2.5px;margin:20px 0}h1 span{color:#f17b2c}p{font-size:19px;line-height:1.9;color:#637b90}.notice{display:inline-block;border-radius:40px;background:#fff0d2;padding:15px 24px;font-weight:700;margin-top:20px}.notice:before{content:'●';color:#eab34a;margin-right:12px}.art{position:relative;aspect-ratio:1;display:grid;place-items:center;background:#dceef9;border-radius:50%}.robot{font-size:clamp(130px,15vw,220px);filter:drop-shadow(0 15px 14px #4d73942b)}.bubble{position:absolute;right:0;top:5%;background:white;border:3px solid #253f62;padding:10px 24px;border-radius:30px;font-size:25px;letter-spacing:5px}.books{position:absolute;bottom:2%;right:-10px;transform:rotate(3deg)}.book{padding:13px 35px;margin:5px;border-radius:8px;background:#314e79;color:white;font-size:20px;font-weight:700;box-shadow:8px 6px 0 #b9cbd9}.book:last-child{background:#548463}.spark{position:absolute;left:8%;top:8%;font-size:45px;color:#eab13b}footer{color:#8a9dab;font-size:12px}@media(max-width:680px){main{padding:25px}.hero{grid-template-columns:1fr;text-align:center;padding:30px 0;gap:30px}header{text-align:center;font-size:12px}h1{letter-spacing:-1px;margin:15px 0}p{font-size:16px;margin:0}.notice{font-size:14px;padding:12px 20px}.art{width:260px;justify-self:center}.robot{font-size:145px}.book{font-size:15px;padding:10px 25px}.bubble{font-size:18px;padding:8px 15px}.spark{font-size:30px}footer{text-align:center}}</style></head><body><main><div class="wrap"><header>PARKRIO</header><div class="hero"><section><div class="label">COMING SOON</div><h1>규약·규정 Chatbot<br><span>준비 중</span>입니다.</h1><p>우리 아파트 규약과 규정을<br>더 쉽고 편리하게 만나보세요.</p><div class="notice">곧 만나보실 수 있습니다</div></section><div class="art" role="img" aria-label="규약과 규정을 준비하는 로봇"><span class="spark">✦</span><div class="bubble">•••</div><div class="robot">🤖</div><div class="books"><div class="book">⚖ 관리규약</div><div class="book">▤ 관련 규정</div></div></div></div><footer>파크리오 규약·규정 안내</footer></div></main></body></html>
