<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="규약·규정 Chatbot 준비 중입니다"><title>파크리오 규약·규정 Chatbot</title><style>*{box-sizing:border-box}body{margin:0;color:#172d51;background:#edf7fe;font-family:'Malgun Gothic',sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:36px;background:radial-gradient(ellipse at 65% 35%,white,#e4f2fb)}.wrap{width:min(1200px,100%)}header{font-size:14px;letter-spacing:4px;color:#55758b;font-weight:700}.hero{display:grid;grid-template-columns:1.3fr 1fr;align-items:center;gap:30px;padding:60px 0}.label{font-size:12px;letter-spacing:5px;color:#6d8a9d}h1{font-size:clamp(32px,4.2vw,62px);line-height:1.45;letter-spacing:-2.5px;margin:20px 0}h1 span{color:#f17b2c}p{font-size:19px;line-height:1.9;color:#637b90}.notice{display:inline-block;border-radius:40px;background:#fff0d2;padding:15px 24px;font-weight:700;margin-top:20px}.notice:before{content:'●';color:#eab34a;margin-right:12px}.art{position:relative;aspect-ratio:1;display:grid;place-items:center;background:#dceef9;border-radius:50%}.robot{font-size:clamp(130px,15vw,220px);filter:drop-shadow(0 15px 14px #4d73942b)}.bubble{position:absolute;right:0;top:5%;background:white;border:3px solid #253f62;padding:10px 24px;border-radius:30px;font-size:25px;letter-spacing:5px}.books{position:absolute;bottom:2%;right:-10px;transform:rotate(3deg)}.book{padding:13px 35px;margin:5px;border-radius:8px;background:#314e79;color:white;font-size:20px;font-weight:700;box-shadow:8px 6px 0 #b9cbd9}.book:last-child{background:#548463}.spark{position:absolute;left:8%;top:8%;font-size:45px;color:#eab13b}footer{color:#8a9dab;font-size:12px}@media(max-width:680px){main{padding:25px}.hero{grid-template-columns:1fr;text-align:center;padding:30px 0;gap:30px}header{text-align:center;font-size:12px}h1{letter-spacing:-1px;margin:15px 0}p{font-size:16px;margin:0}.notice{font-size:14px;padding:12px 2 </style></head><body><main><div class="wrap"><header>PARKRIO</header><div class="hero"><section><div class="label">COMING SOON</div><h1>규약·규정 Chatbot<br><span>준비 중</span>입니다.</h1><p>우리 아파트 규약과 규정을<br>더 쉽고 편리하게 만나보세요.</p><div class="clock-panel" aria-label="한국 현재 시각"><svg viewBox="0 0 320 320" aria-hidden="true"><g id="clock-ticks"></g><text id="clock-date" x="64" y="166" fill="#f2f5fc" font-size="13" font-family="sans-serif"></text><path id="clock-moon" d="M161 245a10 10 0 1 1-10-14 9 9 0 0 0 10 14" fill="#f7faff"/><g class="clock-hand"><line id="clock-hour" x1="160" y1="174" x2="160" y2="85" stroke="#fafcff" stroke-width="8"/><line id="clock-minute" x1="160" y1="172" x2="160" y2="49" stroke="#fafcff" stroke-width="6"/><line id="clock-second" x1="160" y1="177" x2="160" y2="31" stroke="#27dbc2" stroke-width="1.6"/></g><circle cx="160" cy="160" r="4" fill="#fff"/></svg><time id="clock-time"></time><div class="clock-caption">SEOUL · 한국 시간</div></div></section><div class="preparing" role="img" aria-label="챗봇을 준비하고 있음을 나타내는 모래시계"><svg viewBox="0 0 220 290" aria-hidden="true"><defs><linearGradient id="sandGlass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c7e5e9"/></linearGradient><linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffc66f"/><stop offset="1" stop-color="#ef8c44"/></linearGradient></defs><circle cx="110" cy="139" r="95" fill="#e6f0e8"/><ellipse cx="111" cy="251" rx="73" ry="10" fill="#c6d8d8" opacity=".45"/><g transform="rotate(-9 110 140)"><path d="M61 63h98v30c0 26-24 39-40 53 16 13 40 28 40 53v29H61v-29c0-25 24-40 40-53-16-14-40-27-40-53z" fill="url(#sandGlass)" stroke="#4a7d81" stroke-width="5"/><path d="M71 89h78c0 25-25 33-39 48-15-15-39-23-39-48z" fill="url(#sand)"/><path d="M70 219c8-16 26-28 40-39 14 11 31 23 40 39z" fill="url(#sand)"/><path d="M110 144v28" stroke="#f3aa54" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M75 74v18q0 10 7 17m-7 88v13" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/><rect x="48" y="49" width="124" height="17" rx="8" fill="#4a7d81"/><rect x="48" y="224" width="124" height="17" rx="8" fill="#4a7d81"/></g><path d="M181 59v18m-9-9h18M39 146v13m-7-6h14" stroke="#e7b958" stroke-width="4" stroke-linecap="round"/><circle cx="35" cy="93" r="4" fill="#86afb0"/></svg><span>차근차근 준비하고 있어요</span><div class="preparing-dots"><i></i><i></i><i></i></div></div><div class="art" role="img" aria-label="규약과 규정을 준비하는 로봇"><span class="spark">✦</span><div class="bubble">•••</div><div class="robot">🤖</div><div class="books"><div class="book">⚖ 관리규약</div><div class="book">▤ 관련 규정</div></div></div></div><footer>파크리오 규약·규정 안내</footer></div></main><script>
(()=>{const $=id=>document.getElementById(id);const ticks=$('clock-ticks');for(let i=0;i<60;i++){const major=i%5===0;const line=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:160,y1:major?17:20,x2:160,y2:major?35:28,stroke:major?'#557c7e':'#9db2af','stroke-width':major?1.7:1,transform:`rotate(${i*6} 160 160)`}).forEach(([k,v])=>line.setAttribute(k,v));ticks.appendChild(line);}const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});const days={Sun:'일',Mon:'월',Tue:'화',Wed:'수',Thu:'목',Fri:'금',Sat:'토'};function update(){const now=new Date();const parts=Object.fromEntries(fmt.formatToParts(now).map(p=>[p.type,p.value]));const h=Number(parts.hour),m=Number(parts.minute),sec=Number(parts.second);$('clock-hour').setAttribute('transform',`rotate(${(h%12)*30+m/2+sec/120} 160 160)`);$('clock-minute').setAttribute('transform',`rotate(${m*6+sec/10} 160 160)`);$('clock-second').setAttribute('transform',`rotate(${sec*6} 160 160)`);$('clock-date').textContent=`${Number(parts.month)}. ${Number(parts.day)}. (${days[parts.weekday]})`;$('clock-time').textContent=`${parts.hour}:${parts.minute}:${parts.second}`;$('clock-time').dateTime=`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}+09:00`;$('clock-moon').style.opacity=h>=18||h<6?'1':'.35';}update();setInterval(update,250);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});})();
</script></body></html>
